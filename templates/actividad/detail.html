{% extends 'base.html' %}

{% block title %}Registro #{{ registro.pk }}{% endblock %}

{% block content %}
<h1>Registro de Actividad #{{ registro.pk }}</h1>

<p><strong>Tarea:</strong> {{ tarea.titulo }}</p>
<p><strong>Acción:</strong> {{ registro.accion }}</p>
<p><strong>Fecha:</strong> {{ registro.fecha }}</p>

<hr>

<a class="btn btn-secondary"
   href="/empresas/{{ empresa.pk }}/usuarios/{{ usuario.pk }}/tareas/{{ tarea.pk }}/actividad/">
    ← Volver a Actividad
</a>

{% endblock %}
