{% extends 'base.html' %}

{% block title %}
{% if object %}Editar Empresa{% else %}Nueva Empresa{% endif %}
{% endblock %}

{% block content %}

<h1>
    {% if object %}
        Editar: {{ object.nombre_empresa }}
    {% else %}
        Nueva Empresa
    {% endif %}
</h1>

<div class="form-card">

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <div class="form-actions">

            <button type="submit" class="btn btn-primary">
                Guardar
            </button>

            <a href="{% url 'empresas:list' %}" class="btn btn-secondary">
                Cancelar
            </a>

        </div>
    </form>

</div>

{% endblock %}
